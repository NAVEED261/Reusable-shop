version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: boutique-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-neondb_owner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-neondb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-neondb_owner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: boutique-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # User Service
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    container_name: boutique-user-service
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8001,http://localhost:8002}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Product Service
  product-service:
    build:
      context: .
      dockerfile: Dockerfile.product-service
    container_name: boutique-product-service
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8001,http://localhost:8002}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Order Service (minimal config)
  order-service:
    build:
      context: .
      dockerfile: Dockerfile.product-service  # Placeholder
    container_name: boutique-order-service
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

  # Chat Service (minimal config)
  chat-service:
    build:
      context: .
      dockerfile: Dockerfile.product-service  # Placeholder
    container_name: boutique-chat-service
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      - qdrant

  # Frontend (Next.js)
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: boutique-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_USER_SERVICE_URL: http://user-service:8000
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: http://product-service:8000
      NEXT_PUBLIC_ORDER_SERVICE_URL: http://order-service:8000
      NEXT_PUBLIC_CHAT_SERVICE_URL: http://chat-service:8000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
    depends_on:
      - user-service
      - product-service

volumes:
  postgres_data:
  qdrant_data:

networks:
  default:
    name: boutique-network
