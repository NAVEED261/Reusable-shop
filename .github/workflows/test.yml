name: Phase 5 - E2E Test Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  JWT_SECRET: "ci-test-secret-key-for-automated-tests-minimum-32-chars"
  DATABASE_URL: "sqlite://"
  OPENAI_API_KEY: "sk-test-placeholder-for-ci"
  STRIPE_SECRET_KEY: "sk_test_placeholder_for_ci"
  STRIPE_WEBHOOK_SECRET: "whsec_test_secret"

jobs:
  # ------------------------------------------------------------------
  # Backend Unit Tests
  # ------------------------------------------------------------------
  backend-unit-tests:
    name: Backend Unit Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learnflow-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install fastapi uvicorn sqlmodel sqlalchemy bcrypt python-jose[cryptography]
          pip install stripe openai qdrant-client

      - name: Run User Service Tests
        run: |
          pytest tests/unit/test_user_service.py -v --tb=short -m "unit" \
            --junitxml=test-reports/user-service.xml

      - name: Run Product Service Tests
        run: |
          pytest tests/unit/test_product_service.py -v --tb=short -m "unit" \
            --junitxml=test-reports/product-service.xml

      - name: Run Order Service Tests
        run: |
          pytest tests/unit/test_order_service.py -v --tb=short -m "unit" \
            --junitxml=test-reports/order-service.xml

      - name: Run Chat Service Tests
        run: |
          pytest tests/unit/test_chat_service.py -v --tb=short -m "unit" \
            --junitxml=test-reports/chat-service.xml

      - name: Run Stripe Client Tests
        run: |
          pytest tests/unit/test_stripe_client.py -v --tb=short -m "unit" \
            --junitxml=test-reports/stripe-client.xml

      - name: Run All Unit Tests with Coverage
        run: |
          pytest tests/unit/ -v --tb=short -m "unit" \
            --cov=app/backend \
            --cov-report=html:test-reports/coverage-html \
            --cov-report=xml:test-reports/coverage.xml \
            --cov-report=term-missing \
            --junitxml=test-reports/all-unit-tests.xml

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-results
          path: learnflow-app/test-reports/

  # ------------------------------------------------------------------
  # Integration Tests
  # ------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    defaults:
      run:
        working-directory: learnflow-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install fastapi uvicorn sqlmodel sqlalchemy bcrypt python-jose[cryptography]
          pip install stripe openai qdrant-client

      - name: Run Isolated Integration Tests
        run: |
          pytest tests/integration/ -v --tb=short -m "integration" \
            --junitxml=test-reports/integration-tests.xml

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: learnflow-app/test-reports/

  # ------------------------------------------------------------------
  # Frontend E2E Tests (Playwright)
  # ------------------------------------------------------------------
  frontend-e2e-tests:
    name: Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    defaults:
      run:
        working-directory: learnflow-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: learnflow-app/app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd app/frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd tests/e2e/frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright tests (chromium only for CI speed)
        run: |
          cd tests/e2e/frontend
          npx playwright test --project=chromium --reporter=html
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: learnflow-app/test-reports/playwright/

  # ------------------------------------------------------------------
  # Test Summary
  # ------------------------------------------------------------------
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, integration-tests]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Print test summary
        run: |
          echo "=========================================="
          echo "  PHASE 5 TEST SUITE - SUMMARY"
          echo "=========================================="
          echo ""
          echo "Backend Unit Tests: ${{ needs.backend-unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo ""
          echo "=========================================="
          if [ "${{ needs.backend-unit-tests.result }}" = "success" ] && \
             [ "${{ needs.integration-tests.result }}" = "success" ]; then
            echo "  ALL TESTS PASSED"
          else
            echo "  SOME TESTS FAILED"
            exit 1
          fi
          echo "=========================================="
